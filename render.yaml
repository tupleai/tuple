services:
  - type: web
    name: tuple
    runtime: image
    image:
      url: docker.io/tupleai/tuple:6
    plan: free
    numInstances: 1
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: 2099
      - key: DATABASE_URL
        fromDatabase:
          name: tuple-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: TUPLE_ENCRYPTION_KEY
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: tuple
          envVarKey: RENDER_EXTERNAL_URL
      - key: TUPLE_MODE
        value: selfhosted

databases:
  - name: tuple-postgres
    plan: free
    databaseName: tuple
    user: tuple
    ipAllowList: []
